name: linux

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: gcc-15 ${{matrix.build-type}}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain, Ninja, and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build valgrind g++-15

      - name: Configure
        run: >
          CC=gcc-15 CXX=g++-15
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build -v

      - name: Test
        run: ctest --test-dir ${{github.workspace}}/build --output-on-failure --no-tests=error

      # The same cases once more, but under Valgrind: the error paths must not leak either.
      - name: Test under Valgrind
        run: test/run.sh --valgrind --exe ${{github.workspace}}/build/bin/graphtool

  sanitize:
    name: ASan+LSan+UBSan
    runs-on: ubuntu-26.04
    env:
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:detect_leaks=1:log_path=/tmp/sanitizer
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:report_error_type=1:log_path=/tmp/sanitizer

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang g++-15

      - name: Configure
        run: >
          CC=clang CXX=clang++
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,leak,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,leak,undefined"

      - name: Build
        run: cmake --build ${{github.workspace}}/build -v

      - name: Test
        run: ctest --test-dir ${{github.workspace}}/build --output-on-failure --no-tests=error

      # -fno-sanitize-recover=all aborts on the first report, which `ctest` already turns into a
      # failed case -- but the report itself would be buried in that case's output. log_path (see
      # the job env) routes every report to a file instead of stderr and this step prints them all.
      - name: Check for sanitizer reports
        if: always()
        run: |
          shopt -s nullglob
          reports=(/tmp/sanitizer.*)
          if (( ${#reports[@]} != 0 )); then
              cat "${reports[@]}"
              exit 1
          fi
